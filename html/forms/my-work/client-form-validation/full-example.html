<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full example form</title>
  <style>
    input:invalid {
        border: 2px dashed red;
      }

    input:invalid:required {
      background-image: linear-gradient(to right, pink, lightgreen);
    }

    input:valid {
      border: 2px solid black;
    }
  </style>
</head>
<body>
  <form action="" method="post">
    <p>Please complete all required (*) fields.</p>
    <fieldset>
      <legend>Do you have a driver's license? *</legend>
      <input type="radio" name="driver" id="r1" value="yes" required>
      <label for="r1">Yes</label>
      <input type="radio" name="driver" id="r2">
      <label for="r2">No</label>
    </fieldset>
    <p>
      <label for="n1">How old are you?</label>
      <input type="number" name="age" id="n1" min="12" max="120" step="1">
    </p>
    <p>
      <label for="t1">What's your favorite fruit? *</label>
      <input type="text" name="fruit" id="t1" list="l1" required pattern="[Bb]anana|[Cc]herry|[Aa]pple|[Ss]trawberry|[Ll]emon|[Oo]range">
      <datalist id="l1">
        <option value="banana">Banana</option>
        <option value="cherry">Cherry</option>
        <option value="apple">Apple</option>
        <option value="strawberry">Strawberry</option>
        <option value="lemon">Lemon</option>
        <option value="orange">Orange</option>
      </datalist>
    </p>
    <p>
      <label for="t2">What's your email address?</label>
      <input type="email" name="email" id="t2">
    </p>
    <p>
      <label for="t3">Leave a short message</label>
      <textarea name="msg" id="t3" maxlength="140" rows="5"></textarea>
    </p>
    <p>
      <button>Submit</button>
    </p>
  </form>
</body>
</html>
